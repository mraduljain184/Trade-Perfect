# Trade Perfect - local stack (PostgreSQL 16 + FastAPI + Vite frontend).
# Start:  docker compose up --build        Stop: Ctrl+C, then  docker compose down
# UI:     http://localhost:5173/login  (API proxied to backend)
# Wipe the database completely:           docker compose down -v
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATA_DIR: /data
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app          # live code reload while developing
      - ./data:/data:ro         # the provided CSV files (read-only)
    # 1) create/upgrade tables  2) load demo data only if the DB is empty
    # 3) put model v1 in production if no model is in production yet  4) start the API
    command: >
      sh -c "alembic upgrade head &&
             python scripts/seed.py --if-empty &&
             python scripts/register_model.py ml_artifacts/model_v1_report.json --if-no-production &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://backend:8000
      VITE_USE_MOCKS: "false"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  pgdata:
